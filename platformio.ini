[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
test_dir = test
data_dir = data

[env]
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:esp32dev]
extra_scripts = pre:scripts/build_metadata.py
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    links2004/WebSockets @ ^2.4.1
build_src_filter =
    +<*>

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter =
    +<*>
    -<main.cpp>
    -<esp32_app.cpp>
test_build_src = yes
